<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>پرداخت موفق</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, Tahoma, sans-serif;
        background: #0f1115;
        color: #f5f0e8;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 360px;
        text-align: center;
        padding: 28px 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 22px;
        line-height: 1.7;
        opacity: 0.8;
        font-size: 0.95rem;
      }
      a.btn {
        display: inline-block;
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        color: #1a1208;
        background: linear-gradient(135deg, #c9a227, #e07a3d);
      }
      .hint {
        margin-top: 16px;
        font-size: 0.8rem;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✅</div>
      <h1>پرداخت با موفقیت انجام شد</h1>
      <p>
        اعتبار شما به‌زودی در برنامه فعال می‌شود.
        <br />
        برای ادامه، برنامه را دوباره باز کنید.
      </p>
      <a class="btn" id="openApp" href="https://t.me/niathafez_bot">
        بازگشت به برنامه
      </a>
      <p class="hint">اگر دکمه کار نکرد، از منوی ربات یا دکمه منو وارد شوید.</p>
    </div>
    <script>
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          tg.ready();
        }
      } catch (e) {}
    </script>
  </body>
</html>
